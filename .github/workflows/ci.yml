# CI skeleton (S01). The full matrix, coverage, e2e, size gate, pack smoke and
# perf jobs land in S34.
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run lint:nonet
      - run: npm run deps:guard
