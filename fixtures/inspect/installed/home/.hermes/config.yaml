model: fixture-model
# >>> showreceipts >>>
hooks:
  post_tool_call:
    - matcher: ".*"
      command: "/home/u/.showreceipts/bin/showreceipts-hook hook hermes post_tool_call"
      timeout: 10
  post_llm_call:
    - command: "/home/u/.showreceipts/bin/showreceipts-hook hook hermes post_llm_call"
      timeout: 30
  on_session_start:
    - command: "/home/u/.showreceipts/bin/showreceipts-hook hook hermes on_session_start"
      timeout: 5
  on_session_end:
    - command: "/home/u/.showreceipts/bin/showreceipts-hook hook hermes on_session_end"
      timeout: 10
  on_session_finalize:
    - command: "/home/u/.showreceipts/bin/showreceipts-hook hook hermes on_session_finalize"
      timeout: 5
# <<< showreceipts <<<
